name: fabrio_dart_workspace
publish_to: none

environment:
  sdk: ^3.11.0

# The packages arrive slice by slice on the way to 1.0.0 (see the README). Slice 0 holds the contract frontend and
# the IR of the generator.
workspace:
  - packages/fabrio_generator

dev_dependencies:
  lints: ^6.0.0

# Rialto tooling (rialto-dart) is not published yet: path dependencies to a checkout next to this repository
# (../../rialto/rialto-dart). Overrides apply to the whole workspace.
dependency_overrides:
  rialto_contract: {path: ../../rialto/rialto-dart/packages/rialto_contract}
